; ESPDeck Device — ESP32-S3 bridge between Wi-Fi (ESPDeck Bridge on the Mac) and a Stream Deck on USB.
;
; ESP-IDF with Arduino as a component. With a Stream Deck on the native USB port it runs the
; USB host stack; with a computer there, it stays a serial port. Logs always go to the UART port.

[platformio]
; ESP-IDF can't build in a path with spaces, and iCloud Drive shouldn't sync build output.
build_dir = ${sysenv.HOME}/.platformio/build/ESPDeck

[env:espdeck]
; Arduino 3.3.12 on ESP-IDF 5.5.5. Needs PlatformIO Core 6.2 (the pioarduino IDE extension installs it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino, espidf

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3

; Links esp_new_jpeg's prebuilt encoder, which the ESP-IDF builder leaves out.
extra_scripts = post:tools/link_prebuilt.py

; Arduino-as-a-component pulls in every managed component the Arduino libraries might use.
; None of these are needed, and esp_insights doesn't build under PlatformIO.
custom_component_remove =
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp_insights
	espressif/esp_diagnostics
	espressif/esp_diag_data_store
	espressif/esp_schedule
	espressif/esp_secure_cert_mgr
	espressif/esp_rcp_update
	espressif/network_provisioning
	espressif/cbor
	espressif/json_parser
	espressif/json_generator
	espressif/jsmn
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp-sr
	espressif/esp-dsp
	espressif/esp-modbus
	espressif/esp_modem
	espressif/esp-serial-flasher
	espressif/libsodium
	chmorgan/esp-libhelix-mp3
