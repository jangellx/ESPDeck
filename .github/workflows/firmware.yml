# Builds and publishes a firmware release when a tag like firmware-v3.0.0 is pushed:
# the GitHub release gets the OTA image, the merged USB image, their .sha256 files and their
# .sig signatures, and web/ (the browser installer, now pointing at this version) is deployed
# to GitHub Pages.
#
# One-time setup: Settings → Pages → Source: GitHub Actions, and the repository secret
# FIRMWARE_SIGNING_KEY (the Ed25519 private key, PEM; see docs/development.md, Release signing). Without
# the secret the job fails before anything is published.
name: Firmware release

# Actions are pinned to commit SHAs (the version in each comment); all run on Node 24.

on:
  push:
    tags:
      - "firmware-v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The pioarduino platform pinned in platformio.ini needs PlatformIO Core 6.2.
      - name: Install PlatformIO
        run: pip install "platformio>=6.2,<6.3" esptool

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('ESPDeck Device/platformio.ini', 'ESPDeck Device/src/idf_component.yml') }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#firmware-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "ESPDeck Device/tools/release.sh" "$VERSION"

      # ESPDeck Bridge installs only release files with a valid signature. sign_release.sh
      # checks each one against the public key the app has, and removes its copy of the key.
      - name: Sign
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          DIST="ESPDeck Device/dist"
          "ESPDeck Device/tools/sign_release.sh" "$DIST/espdeck-firmware-$VERSION.bin" "$DIST/espdeck-firmware-$VERSION-merged.bin"

      # GitHub sometimes runs the workflow twice for one tag. The second run finds the
      # release already there and replaces its assets instead of failing (the signatures come
      # out the same: Ed25519 is deterministic).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="ESPDeck Device/dist"
          ASSETS=(
            "$DIST/espdeck-firmware-$VERSION.bin" "$DIST/espdeck-firmware-$VERSION.bin.sha256" "$DIST/espdeck-firmware-$VERSION.bin.sig"
            "$DIST/espdeck-firmware-$VERSION-merged.bin" "$DIST/espdeck-firmware-$VERSION-merged.bin.sha256" "$DIST/espdeck-firmware-$VERSION-merged.bin.sig"
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${ASSETS[@]}"
          elif ! gh release create "$GITHUB_REF_NAME" --title "Firmware $VERSION" --notes "ESPDeck firmware $VERSION" "${ASSETS[@]}"; then
            # Created by another run in the meantime.
            gh release view "$GITHUB_REF_NAME" > /dev/null
            gh release upload "$GITHUB_REF_NAME" --clobber "${ASSETS[@]}"
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
