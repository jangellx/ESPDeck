# Builds and publishes a firmware release when a tag like firmware-v3.0.0 is pushed:
# the GitHub release gets the OTA image, the merged USB image and their .sha256 files, and
# web/ (the browser installer, now pointing at this version) is deployed to GitHub Pages.
#
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Firmware release

on:
  push:
    tags:
      - "firmware-v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pioarduino platform pinned in platformio.ini needs PlatformIO Core 6.2.
      - name: Install PlatformIO
        run: pip install "platformio>=6.2,<6.3" esptool

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('ESPDeck Device/platformio.ini', 'ESPDeck Device/src/idf_component.yml') }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#firmware-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "ESPDeck Device/tools/release.sh" "$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="ESPDeck Device/dist"
          gh release create "$GITHUB_REF_NAME" --title "Firmware $VERSION" --notes "ESPDeck firmware $VERSION" \
            "$DIST/espdeck-firmware-$VERSION.bin" "$DIST/espdeck-firmware-$VERSION.bin.sha256" \
            "$DIST/espdeck-firmware-$VERSION-merged.bin" "$DIST/espdeck-firmware-$VERSION-merged.bin.sha256"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
